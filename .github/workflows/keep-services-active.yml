name: Check blog services

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: blog-health-check
  cancel-in-progress: true

jobs:
  health-check:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Check API and database health
        env:
          HEALTH_URL: ${{ vars.BACKEND_HEALTH_URL }}
        run: |
          if [ -z "$HEALTH_URL" ]; then
            echo "::error::Set the BACKEND_HEALTH_URL repository variable to your API health endpoint."
            exit 1
          fi

          response="$(curl --fail --silent --show-error --max-time 30 "$HEALTH_URL")"
          printf '%s\n' "$response" | jq --exit-status '
            .server == "ok" and .database == "ok"
          ' >/dev/null || {
            echo "::error::API or database health check failed."
            printf '%s\n' "$response"
            exit 1
          }

          echo "API and database are healthy."
